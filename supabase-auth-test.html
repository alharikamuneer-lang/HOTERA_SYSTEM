<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOTERA Supabase Auth Test</title>
<style>body{margin:0;background:#061326;color:#e5eef8;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(620px,96vw);padding:24px;border:1px solid #2dd4bf66;border-radius:20px;background:linear-gradient(145deg,#102d49,#071323);box-shadow:0 20px 60px #0008}h1{color:#fde68a;font-size:22px}p{line-height:1.8;color:#cbd5e1;font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#a5f3fc}.field input{padding:11px;border:1px solid #94a3b866;border-radius:9px;background:#020817;color:white;direction:ltr}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer;background:#06b6d4;color:#04202a}button.secondary{background:#334155;color:white}.result{white-space:pre-wrap;margin-top:16px;padding:13px;border-radius:10px;background:#020817;color:#cbd5e1;line-height:1.8;font-size:12px}.ok{color:#86efac}.bad{color:#fca5a5}</style>
<main class="card"><h1>HOTERA — اختبار Supabase Auth</h1><p>صفحة اختبار منفصلة فقط. لا تحفظ كلمة المرور أو المفتاح، وتستخدم حساب مدير الفندق لاختبار جلسة Auth ثم إضافة وتعديل حجز تجريبي. لا تلمس النظام الأساسي أو localStorage.</p>
<div class="field"><label>Project URL</label><input id="url" placeholder="https://project-ref.supabase.co" autocomplete="off"></div>
<div class="field"><label>Publishable key أو anon public key</label><input id="key" type="password" autocomplete="off"></div>
<div class="field"><label>بريد حساب مدير الفندق في Supabase</label><input id="email" type="email" autocomplete="off"></div>
<div class="field"><label>كلمة مرور حساب مدير الفندق</label><input id="password" type="password" autocomplete="off"></div>
<div class="actions"><button onclick="loginOnly()">اختبار تسجيل الدخول</button><button onclick="writeTest()">اختبار إنشاء وتعديل حجز</button></div><div id="result" class="result">بانتظار الاختبار.</div></main>
<script>
let accessToken='';
function cfg(){let raw=document.getElementById('url').value.trim();let m=raw.match(/https:\/\/[^\s]+/i);let url=(m?m[0]:raw).replace(/[),؛،]+$/,'').replace(/\/$/,'');let key=document.getElementById('key').value.trim();let u;try{u=new URL(url)}catch(e){}if(!u||u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co'))throw Error('Project URL يجب أن يكون بصيغة https://معرّف-المشروع.supabase.co');if(!key)throw Error('أدخل المفتاح العام');return {url,key}}
function out(t,good=false){let e=document.getElementById('result');e.className='result '+(good?'ok':'bad');e.textContent=t}
async function loginOnly(){try{let c=cfg(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('أدخل البريد وكلمة المرور');out('جارٍ تسجيل الدخول...',true);let r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store'});let b=await r.text();if(!r.ok)throw Error('Auth HTTP '+r.status+' — '+b.slice(0,220));let j=JSON.parse(b);accessToken=j.access_token||'';if(!accessToken)throw Error('لم يتم استلام access token');out('نجح تسجيل الدخول عبر Supabase Auth.\nلم يتم حفظ كلمة المرور أو المفتاح.',true)}catch(e){accessToken='';out('تعذر تسجيل الدخول:\n'+e.message)} }
async function writeTest(){try{if(!accessToken){await loginOnly();if(!accessToken)return}let c=cfg(),h={apikey:c.key,Authorization:'Bearer '+accessToken,'Content-Type':'application/json',Prefer:'return=representation'};let ref='HOTERA-AUTH-TEST-'+Date.now();let payload={hotel_id:1,room_id:null,booking_reference:ref,guest_name:'Auth Test Guest',check_in:new Date(Date.now()+86400000).toISOString().slice(0,10),check_out:new Date(Date.now()+3*86400000).toISOString().slice(0,10),status:'confirmed',booking_source:'website',visit_purpose:'tourism'};let r=await fetch(c.url+'/rest/v1/hotera_bookings',{method:'POST',headers:h,body:JSON.stringify(payload),cache:'no-store'});let b=await r.text();if(!r.ok)throw Error('INSERT HTTP '+r.status+' — '+b.slice(0,240));let rows=JSON.parse(b),id=rows[0]?.id;if(!id)throw Error('لم يرجع الخادم معرّف الحجز');let u=await fetch(c.url+'/rest/v1/hotera_bookings?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:h,body:JSON.stringify({status:'confirmed'})});let ub=await u.text();if(!u.ok)throw Error('UPDATE HTTP '+u.status+' — '+ub.slice(0,240));out('نجح اختبار الكتابة للمستخدم المسجل.\nتم إنشاء الحجز التجريبي: '+ref+'\nثم تم تنفيذ UPDATE للحجز نفسه.\nلم يتم تنفيذ DELETE.',true)}catch(e){out('تعذر اختبار الكتابة:\n'+e.message+'\n\nتحقق من تسجيل الدخول وسياسات INSERT وUPDATE.')}}
</script></html>
